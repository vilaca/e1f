name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies (locked)
        run: uv sync --extra dev

      # shellcheck is pre-installed on ubuntu-latest; the gate skips gracefully
      # if not available locally (install with: brew install shellcheck).

      # Same script CI and developers run locally — the single definition of green.
      - name: Run checks
        run: ./scripts/check.sh
