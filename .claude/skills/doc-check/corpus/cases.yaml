# doc-check regression corpus
#
# Each case pins a verdict the judge must reproduce when the doc-check prompt
# or model changes. Run the corpus before committing a new version of SKILL.md
# or switching models.
#
# VIOLATED cases re-introduce real past bugs caught by doc-check.
# HOLDS (restraint) cases must NOT be flagged — they fail the corpus if the
# judge is too eager. Both kinds are required to prevent judge drift in either
# direction.
#
# To run: invoke /doc-check, read each case's `finding:`, and verify the
# verdict matches. Optional `diff:` files are illustrative only.

cases:
  - name: fallback_not_opt_in
    verdict: VIOLATED
    section: "2 (stale claims)"
    finding: >
      README implies yfinance fallback is automatic when ftgo has no data,
      but it requires the explicit --fallback flag. A user following the README
      would not know to pass --fallback and would see no fallback behaviour.

  - name: schema_columns_in_prose
    verdict: VIOLATED
    section: "1 (prose restating code shape)"
    finding: >
      README enumerates SQLite column names (isin, date, close) directly in
      prose. These are frozen in src/e1f/fetch.py and tested in
      tests/test_contracts.py. Prose that copies column names will silently
      diverge if the schema changes.

  - name: claude_md_stale_check_gates
    verdict: VIOLATED
    section: "2 (stale claims)"
    finding: >
      CLAUDE.md Running checks block lists only lint, layers, types, test but
      scripts/check.sh default gates also include shell, actions, and dead.
      Agent instructions drift from the actual check script and CI will miss
      gates the doc omits.

  - name: claude_md_stale_transactions_blurb
    verdict: VIOLATED
    section: "2 (stale claims)"
    finding: >
      CLAUDE.md Layout describes transactions.py as "broker CSV ingestion" only,
      but the module also ingests XTB Excel (ADR-0006). The agent-facing module
      blurb is stale.

  - name: sit_out_adr_vs_pinned_test_drift
    verdict: VIOLATED
    section: "3 (financial timing/fill conventions)"
    finding: >
      ADR-0026 says sit-out-month sells at the last fill before the selected
      month, but simulate_seasonal and
      test_sit_out_sells_at_selected_fill_and_reenters_at_next_fill use the
      selected month's own fill and re-enter at the next fill. The governing
      ADR and pinned-date behavior disagree.

  - name: sit_out_convention_aligned
    verdict: HOLDS
    section: "3 (financial timing/fill conventions)"
    note: >
      ADR-0026 and ADR-0028 say sit-out-month sells at the selected month's fill
      and re-enters at the next fill. The pinned test uses literal dates and a
      hand-computed terminal value that matches. This aligned state must not be
      flagged.

  - name: readme_seasonality_summary_without_fill_details
    verdict: HOLDS
    section: "3 (financial timing/fill conventions)"
    note: >
      README describes seasonality at calendar-month level and links its ADRs
      without copying monthly_fill_indices or sit-out mechanics. Per one home
      per fact, the summary must not be flagged for omitting fill details.

  - name: price_sources_summary_ok
    verdict: HOLDS
    section: "4 (redundancy)"
    note: >
      The README Price sources section summarises ADR-0002 at a high level.
      This looks like redundancy but is intentional — a README reader needs
      orientation without opening the ADR. The section must NOT be flagged as
      a second source of truth. Flag only if it contradicts the ADR, not merely
      for summarising it.

  - name: check_sh_coverage_comment_out_of_scope
    verdict: HOLDS
    section: "0 (scope)"
    note: >
      scripts/check.sh has a maintainer comment "Current coverage is ~94%" that
      may lag pytest output by a point or two. doc-check must NOT flag script
      header comments — scope is README.md, CLAUDE.md, ADR/*.md, skills, and
      data/glossary.md only.

  - name: glossary_term_points_at_experimental_command
    verdict: VIOLATED
    section: "7 (metric glossary)"
    finding: >
      A data/glossary.md term's **Where:** line names an experimental command
      (e.g. backtest or seasonality). ADR-0034 scopes the glossary to
      stable-command metrics only (performance, portfolio, deposits, benchmark,
      correlation); an experimental source is out of scope and must be flagged.

  - name: glossary_family_table_not_a_missing_term
    verdict: HOLDS
    section: "7 (metric glossary)"
    note: >
      The "## Metric families" and "## What isn't measured" sections and the
      per-group intro prose are orientation text the parser ignores (they have no
      ### term headings). doc-check must NOT flag them as coverage drift or as
      undocumented terms — only ### headings are terms.

  - name: glossary_whitespace_query_lists_every_term
    verdict: VIOLATED
    section: "7 (metric glossary)"
    finding: >
      A whitespace-only explicit glossary query strips to an empty needle and
      matches every heading. It must be rejected as an empty lookup rather than
      behaving like the intentionally omitted query that lists all terms.

  - name: glossary_whitespace_query_rejected
    verdict: HOLDS
    section: "7 (metric glossary)"
    note: >
      An omitted glossary query lists all terms, while an explicitly supplied
      whitespace-only query returns no matches. The two inputs are deliberately
      distinct and this behavior must not be flagged.

  - name: readme_duplicates_metric_formulas
    verdict: VIOLATED
    section: "4 (redundancy)"
    finding: >
      README contains paragraph-length definitions or formulas for XIRR, TWR,
      volatility, drawdown, CAGR, or P&L contribution even though
      data/glossary.md is the single source for metric interpretation.

  - name: readme_points_to_metric_glossary
    verdict: HOLDS
    section: "4 (redundancy)"
    note: >
      README names the metrics a command reports, gives high-level orientation,
      and points to e1f glossary for definitions without copying formulas. This
      is appropriate user guidance, not a second source of truth.
