[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "e1f"
version = "0.1.0"
description = "ETF universe config and price fetching into SQLite (ftgo / yfinance)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "PyYAML",
    "requests",
    "yfinance",
    "ftgo",
    "openpyxl>=3.1.5",
]

[project.scripts]
e1f = "e1f.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-PyYAML",
    "pandas-stubs",
    "import-linter",
    "vulture",
    "hypothesis>=6.165.10",
    "mutmut>=3.7.0",
]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "SIM", "PLR", "PLC0415", "BLE", "DTZ", "RUF"]
# Intentional mathematical notation in the correlation command's report and
# docstrings: ρ (Pearson correlation), × (pair separator), − (minus in formulae).
allowed-confusables = ["ρ", "×", "−"]
ignore = [
    "PLR0911",  # too-many-return-statements in config.main (subcommand dispatch)
    "PLR0912",  # too-many-branches in config.main
    "PLR0913",  # too-many-arguments: call_with_retry has a deliberate keyword-only API
    "PLR0917",  # too-many-positional: DataExtractor.__init__ uses keyword args in practice
    "PLR0915",  # too-many-statements in config.main
    "PLR2004",  # magic-value-comparison: HTTP status codes (429, 500, 600) are self-documenting
]

[tool.ruff.lint.per-file-ignores]
# Application code keeps all imports at the top of the file (PLC0415). Tests may
# import locally — deferred loads after fixture setup, per-test symbol pulls.
"tests/**" = ["PLC0415"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["yfinance.*", "ftgo.*", "scipy.*"]
ignore_missing_imports = true

[tool.mutmut]
source_paths = ["src"]
only_mutate = [
    "src/e1f/common/rebalance.py",
    "src/e1f/common/scenarios.py",
    "src/e1f/transactions.py",
]
pytest_add_cli_args_test_selection = [
    "tests/test_rebalance.py",
    "tests/test_rebalance_properties.py",
    "tests/test_scenario.py",
    "tests/test_transactions.py",
]
# Covered-line filtering is deliberately disabled: its coverage-gathering pass
# pops every test-loaded module out of sys.modules and re-imports them, which
# makes numpy's C extension abort ("cannot load module more than once per
# process"). The per-function CLI globs in scripts/check.sh already scope the
# mutants that actually run, so covered-line filtering is redundant here.
mutate_only_covered_lines = false

[tool.importlinter]
root_packages = ["e1f"]

[[tool.importlinter.contracts]]
name = "Module layers: cli -> command modules -> common"
type = "layers"
layers = [
    "e1f.cli",
    "e1f.autocomplete | e1f.config | e1f.fetch | e1f.validate | e1f.transactions | e1f.portfolio | e1f.performance | e1f.benchmark | e1f.deposits | e1f.correlation | e1f.rebalance | e1f.scenario | e1f.glossary",
    "e1f.common",
]

# Experimental tier is isolated (ADR-0024): stable command modules and shared
# ``common`` may never import ``e1f.experimental``. The CLI router (``e1f.cli``)
# is deliberately absent from the sources — it is the sole crossing, so it can
# register the experimental commands.
[[tool.importlinter.contracts]]
name = "Experimental tier is isolated: only cli may import it (ADR-0024)"
type = "forbidden"
source_modules = [
    "e1f.autocomplete",
    "e1f.config",
    "e1f.fetch",
    "e1f.validate",
    "e1f.transactions",
    "e1f.portfolio",
    "e1f.performance",
    "e1f.benchmark",
    "e1f.deposits",
    "e1f.correlation",
    "e1f.rebalance",
    "e1f.scenario",
    "e1f.glossary",
    "e1f.common",
]
forbidden_modules = ["e1f.experimental"]

# Within the experimental tier: command modules depend on experimental.common
# (and not on each other); experimental.common never imports the commands. It
# may still consume shared ``e1f.common`` (unconstrained here).
[[tool.importlinter.contracts]]
name = "Experimental layers: commands -> experimental.common (ADR-0024)"
type = "layers"
layers = [
    "e1f.experimental.backtest | e1f.experimental.concentration | e1f.experimental.overlap | e1f.experimental.lookthrough | e1f.experimental.seasonality",
    "e1f.experimental.common",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/e1f" = [
    "data/currency_metadata.yaml",
    "data/etf_universe.yaml",
    "data/glossary.md",
]
