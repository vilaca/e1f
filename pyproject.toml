[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "e1f"
version = "0.1.0"
description = "ETF universe config and price fetching into SQLite (ftgo / yfinance)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "numpy",
    "pandas",
    "PyYAML",
    "requests",
    "yfinance",
    "ftgo",
    "openpyxl>=3.1.5",
]

[project.scripts]
e1f = "e1f.cli:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "types-PyYAML", "pandas-stubs", "import-linter", "vulture"]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "SIM", "PLR", "BLE", "DTZ", "RUF"]
ignore = [
    "PLR0911",  # too-many-return-statements in config.main (subcommand dispatch)
    "PLR0912",  # too-many-branches in config.main
    "PLR0913",  # too-many-arguments: call_with_retry has a deliberate keyword-only API
    "PLR0917",  # too-many-positional: DataExtractor.__init__ uses keyword args in practice
    "PLR0915",  # too-many-statements in config.main
    "PLR2004",  # magic-value-comparison: HTTP status codes (429, 500, 600) are self-documenting
]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["yfinance.*", "ftgo.*"]
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["e1f"]

[[tool.importlinter.contracts]]
name = "Module layers: cli -> command modules -> common"
type = "layers"
layers = [
    "e1f.cli",
    "e1f.autocomplete | e1f.config | e1f.fetch | e1f.validate | e1f.transactions | e1f.portfolio | e1f.performance | e1f.concentration",
    "e1f.common",
]

[tool.setuptools.packages.find]
where = ["src"]
